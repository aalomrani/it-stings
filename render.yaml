# It Stings on Render (free web service) — a one-click Blueprint.
#
# New → Blueprint → pick this repo, and Render reads this file. The service name below
# becomes the public URL: https://<name>.onrender.com. "itstings" if it is free, else
# Render appends a suffix (rename it in the dashboard to itstings-<something>).
#
# The engine is deterministic and keyless: no ANTHROPIC key, no cost, no run caps. Nothing
# secret is needed to run it.
#
# NOTE ON DATA: Render's FREE tier has no persistent disk, so the SQLite file at
# ITSTINGS_DB_PATH resets whenever the service restarts (a redeploy, or waking from the
# 15-minute idle sleep). Search/recommend still work, but per-user training does not
# accumulate across restarts yet. The follow-up is to point the app at a free cloud
# database (Turso/libSQL) so profiles + feedback persist; that is a code change tracked
# separately. Until then this is a live, free, named demo.
services:
  - type: web
    name: itstings
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render injects PORT itself and the standalone server binds to it; do not pin it.
      - key: ITSTINGS_DB_PATH
        value: /tmp/itstings.sqlite
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
