<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>It Stings — empty state (Ink &amp; Lounge)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   INK & LOUNGE — empty state
   Off-black ground, brush-and-ink line, halftone screens.
   The search bar is a gash cut clean through the drawing.
   ============================================================ */

:root{
  --void:#080A09;
  --ground:#0E1110;
  --ground-2:#161A18;
  --ground-3:#1E2422;
  --bone:#EFE7D6;
  --bone-2:#B6AE9E;
  --stamp:#9A9385;
  --teal:#3FB0A0;
  --teal-deep:#1E6E64;
  --mustard:#F0B23A;
  --ox:#9E2A3C;
  --flare:#D8697A;
  --hair:#6E8082;
  --hair-2:#7A8C8E;

  --display:"Bricolage Grotesque","Archivo Black","Haettenschweiler","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

*,*::before,*::after{box-sizing:border-box}

html,body{height:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--bone);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* --- hidden defs carrier ------------------------------------ */
.defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}

/* --- paper tooth: sits BEHIND everything, never over text ---- */
.grain{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
  opacity:.055;
  mix-blend-mode:screen;
}

/* --- shell -------------------------------------------------- */
.stage{
  position:relative;
  z-index:1;
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2.2rem 1rem 1.4rem;
}

.scene{
  position:relative;
  /* three cascading declarations: each is dropped whole if the browser
     cannot parse it, so the simplest one always survives */
  width:min(92vw, 56rem);
  width:min(92vw, 56rem, (100vh - 9rem) * 1.5806);
  width:min(92vw, 56rem, (100svh - 9rem) * 1.5806);
  aspect-ratio:980 / 620;
}

.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.art-tall{display:none}

/* --- the gash: the search bar, cut into the drawing ---------- */
.slot{
  position:absolute;
  left:11.22%;
  width:77.55%;
  top:59.84%;
  height:13.23%;
  min-height:52px;
  transform:translateY(-50%);
  display:block;
  margin:0;
}

.slot-field{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
}

/* the ink lips that overlap the field — decorative, above the input,
   kept clear of the text column by pointer-events + left inset */
.lips{
  position:absolute;
  inset:-16% -2%;
  pointer-events:none;
  z-index:3;
}

/* wordmark, set in the display face inside the drawing */
.wm{
  font-family:var(--display);
  font-weight:800;
  font-variation-settings:"wdth" 76, "opsz" 96;
  letter-spacing:-0.02em;
}

#q{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  margin:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--bone);
  font-family:var(--body);
  font-weight:500;
  font-size:clamp(15px, 1.9vw, 21px);
  letter-spacing:.005em;
  padding:0 clamp(14px,3.4%,34px) 0 clamp(16px,4.2%,44px);
  caret-color:var(--mustard);
  appearance:none;
  -webkit-appearance:none;
  border-radius:0;
}
#q::-webkit-search-decoration,
#q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--bone-2);font-weight:400;opacity:1}
#q:focus-visible{outline:0}
/* focus is drawn, not a browser ring: a mustard underscore inside the gash */
.focus-rule{
  position:absolute;
  z-index:2;
  left:clamp(16px,4.2%,44px);
  right:clamp(14px,3.4%,34px);
  bottom:16%;
  height:3px;
  background:var(--mustard);
  opacity:0;
  transform:scaleX(.2);
  transform-origin:left center;
  transition:opacity .12s steps(2,end), transform .12s steps(2,end);
}
#q:focus + .focus-rule{opacity:1;transform:scaleX(1)}

/* --- the one line under the bar ----------------------------- */
.try{
  position:absolute;
  z-index:4;
  left:0;
  top:calc(100% + .55rem);
  display:flex;
  align-items:baseline;
  gap:.5rem;
  font-family:var(--mono);
  font-size:clamp(11px,1.15vw,13px);
  letter-spacing:.01em;
  color:var(--stamp);
  white-space:nowrap;
}
.try b{
  font-weight:500;
  color:var(--teal);
  border-bottom:1px solid rgba(63,176,160,.5);
  cursor:pointer;
}

.sr{
  position:absolute;
  width:1px;height:1px;
  margin:-1px;padding:0;border:0;
  clip-path:inset(50%);
  overflow:hidden;
  white-space:nowrap;
}

/* --- footer stamp ------------------------------------------- */
.stamp-row{
  position:relative;
  z-index:1;
  margin-top:1.6rem;
  font-family:var(--mono);
  font-size:11px;
  line-height:1.6;
  color:var(--stamp);
  text-align:center;
  max-width:44rem;
  padding:0 1rem;
}
.stamp-row a{color:var(--hair-2);text-decoration:none;border-bottom:1px solid rgba(110,128,130,.45)}

/* ============================================================
   THE ONE STEPPED-MOTION MOMENT
   A snapped bass string. Three drawn frames on a filmstrip,
   advanced with steps(3, jump-none). One shot on load, then it
   rests on the settled frame. No easing anywhere.
   ============================================================ */
.whip-strip{
  transform-box:view-box;
  transform-origin:0 0;
  transform:translateX(-660px);              /* rest = frame 3 */
  animation:twang .66s steps(3, jump-none) .45s 1 both;
}
@keyframes twang{
  from{transform:translateX(0px)}
  to  {transform:translateX(-660px)}
}
.whip-strip-tall{
  transform-box:view-box;
  transform-origin:0 0;
  transform:translateX(-520px);
  animation:twang-tall .66s steps(3, jump-none) .45s 1 both;
}
@keyframes twang-tall{
  from{transform:translateX(0px)}
  to  {transform:translateX(-520px)}
}

@media (prefers-reduced-motion: reduce){
  .whip-strip{animation:none;transform:translateX(-660px)}
  .whip-strip-tall{animation:none;transform:translateX(-520px)}
  .focus-rule{transition:none}
}

/* --- portrait recomposition --------------------------------- */
@media (max-width: 680px){
  .scene{
    width:min(94vw, 26rem);
    aspect-ratio:420 / 620;
  }
  .art-wide{display:none}
  .art-tall{display:block}
  .slot{
    left:4.76%;
    width:90.48%;
    top:54.84%;
    height:14.19%;
    min-height:50px;
  }
  #q{font-size:16px;padding:0 14px 0 18px}
  .try{font-size:11px;white-space:normal}
  .stage{justify-content:flex-start;padding-top:1.4rem}
  .stamp-row{font-size:10px;margin-top:2.4rem}
}
@media (max-width: 400px){
  .try{gap:.35rem}
}
</style>
</head>
<body>

<!-- ============ shared ink defs: filters, screens ============ -->
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <!-- rough-edge: the entire linework vocabulary runs through this -->
    <filter id="rough" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.017 0.024" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-lite" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.031 0.042" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-hard" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="4" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- photocopier grain -->
    <filter id="grain-f" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
    </filter>

    <!-- halftone screens: three discrete densities, no gradients -->
    <pattern id="dots-bone" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(21)">
      <circle cx="3.5" cy="3.5" r="1.1" fill="var(--bone)"/>
    </pattern>
    <pattern id="dots-mustard" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
      <circle cx="4" cy="4" r="1.75" fill="var(--mustard)"/>
    </pattern>
    <pattern id="dots-teal" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(33)">
      <circle cx="3" cy="3" r="1.25" fill="var(--teal)"/>
    </pattern>
    <pattern id="dots-ox" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <circle cx="4.5" cy="4.5" r="2.1" fill="var(--ox)"/>
    </pattern>

    <!-- filmstrip windows for the stepped motion -->
    <clipPath id="whip-win"><rect x="496" y="96" width="330" height="252"/></clipPath>
    <clipPath id="whip-win-tall"><rect x="150" y="120" width="260" height="200"/></clipPath>
  </defs>
</svg>

<!-- ============ paper tooth, behind every text block ========= -->
<svg class="grain" aria-hidden="true" focusable="false" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <rect x="0" y="0" width="1200" height="900" filter="url(#grain-f)"/>
</svg>

<main class="stage">

  <div class="scene">

    <!-- ================= LANDSCAPE COMPOSITION ================= -->
    <svg class="art art-wide" viewBox="0 0 980 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A double bass drawn in brush and ink, sliced across the middle by an open slot. One string has snapped and whips out to the right, trailing a drop of ink.">

        <path d="M 745,-13 C 842,-11 923,60 921,166 C 919,270 838,343 743,341 C 646,339 567,268 569,164 C 571,62 650,-15 745,-13 Z" fill="url(#dots-mustard)" opacity="0.9"/>
        <path d="M 745,-13 C 842,-11 923,60 921,166 C 919,270 838,343 743,341 C 646,339 567,268 569,164 C 571,62 650,-15 745,-13 Z" fill="none" stroke="var(--mustard)" stroke-width="2.6" opacity="0.55" filter="url(#rough)"/>
      </g>

              fill="var(--teal-deep)" opacity="0.62"/>

        <!-- the body: flat mass, then a screen, then the ink outline -->

        <path d="M 490,40 C 566,40 618,98 640,158 C 662,218 700,206 700,240 C 700,276 646,296 636,336 C 626,378 690,404 720,456 C 754,514 772,606 726,692 L 254,692 C 208,606 226,514 260,456 C 290,404 354,378 344,336 C 334,296 280,276 280,240 C 280,206 318,218 340,158 C 362,98 414,40 490,40 Z"

          <rect x="378" y="252" width="30" height="4" rx="1" transform="rotate(-6 393 254)"/>
        </g>
      </g>

      <!-- strings: the only perfectly straight things in the drawing -->
      <g fill="var(--bone)">
        <path d="M 449,0 L 455,0 L 421,560 L 415,560 Z"/>
        <path d="M 471,0 L 477,0 L 465,560 L 459,560 Z"/>

      </g>

      <!-- ---------- STEPPED MOTION: the twang, 3 drawn frames ---------- -->

    <!-- ================= PORTRAIT COMPOSITION ================= -->
    <svg class="art art-tall" viewBox="0 0 420 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A double bass drawn in brush and ink, sliced across the middle by an open slot. One string has snapped and whips out to the right, trailing a drop of ink.">
